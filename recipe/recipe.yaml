schema_version: 1

context:
  component_name: rendering
  repo_name: ${{ "gz-" + component_name }}
  version: 9.4.0
  major_version: "9"
  name: ${{ repo_name + major_version }}
  component_version: ${{ component_name + major_version }}
  cxx_name: ${{ "lib" + name }}

recipe:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/gazebosim/${{ repo_name }}/archive/${{ repo_name }}${{ major_version }}_${{ version }}.tar.gz
    sha256: 7d705a5735e8cacba2b02a7ddf5343f89673bf4c86714872163ee10f1def3b0b
    patches:
      - conda-ogre-hint.patch

build:
  number: 1

outputs:
  # Build everything once; the package outputs below select their files from it.
  - staging:
      name: ${{ cxx_name }}-build
    build:
      script:
        - if: unix
          then: build_cxx.sh
        - if: win
          then: bld_cxx.bat
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ninja
        - cmake
        - pkgconf
      host:
        - if: linux
          then:
            - libglu
            - libglx-devel
            - libopengl-devel
            - libegl-devel
        - if: win
          then:
            - dlfcn-win32
        - libgz-math8
        - libgz-common6
        - libgz-plugin3
        - libgz-utils3
        - ogre-next
        - ogre 1.10.*

  # Core library and the ogre2 (ogre-next) engine, without the ogre 1.x engine.
  - package:
      name: ${{ cxx_name }}
    inherit: ${{ cxx_name }}-build
    build:
      files:
        exclude:
          - "**/engine-plugins/*gz-rendering9-ogre.*"
          - "**/engine-plugins/*gz-rendering-ogre.*"
          - "lib/*gz-rendering9-ogre.*"
          - "Library/lib/gz-rendering9-ogre.*"
          - "Library/bin/gz-rendering9-ogre.*"
          - "**/cmake/gz-rendering9-ogre/**"
          - "**/gz/rendering/ogre/**"
          - "**/gz/rendering/ogre.hh"
          - "**/pkgconfig/gz-rendering9-ogre.pc"
          - "**/share/gz/gz-rendering9/ogre/**"
    requirements:
      run:
        - if: linux
          then:
            - libglx-devel
            - libopengl-devel
            - libegl-devel
      run_exports:
        - ${{ pin_subpackage(cxx_name, upper_bound='x') }}
      ignore_run_exports:
        from_package:
          - ogre
    tests:
      - script:
          - if: not win
            then:
              - test -f ${PREFIX}/include/gz/${{ component_version }}/gz/${{ component_name }}.hh
              - test -f ${PREFIX}/lib/lib${{ name }}${SHLIB_EXT}
              - test -f ${PREFIX}/lib/cmake/${{ name }}/${{ name }}-config.cmake
              - test -f ${PREFIX}/lib/gz-${{ component_name }}-${{ major_version }}/engine-plugins/lib${{ name }}-ogre2${SHLIB_EXT}
              - test ! -f ${PREFIX}/lib/gz-${{ component_name }}-${{ major_version }}/engine-plugins/lib${{ name }}-ogre${SHLIB_EXT}
              - test ! -e ${PREFIX}/lib/gz-${{ component_name }}-${{ major_version }}/engine-plugins/libgz-rendering-ogre${SHLIB_EXT}
              - test ! -d ${PREFIX}/lib/OGRE
            else:
              - if not exist %PREFIX%\\Library\\include\\gz\\${{ component_version }}\\gz\\${{ component_name }}.hh exit 1
              - if not exist %PREFIX%\\Library\\lib\\${{ name }}.lib exit 1
              - if not exist %PREFIX%\\Library\\bin\\${{ name }}.dll exit 1
              - if not exist %PREFIX%\\Library\\lib\\cmake\\${{ name }}\\${{ name }}-config.cmake exit 1
              - if not exist %PREFIX%\\Library\\lib\\gz-${{ component_name }}-${{ major_version }}\\engine-plugins\\${{ name }}-ogre2.dll exit 1
              - if exist %PREFIX%\\Library\\lib\\gz-${{ component_name }}-${{ major_version }}\\engine-plugins\\${{ name }}-ogre.dll exit 1
              - if exist %PREFIX%\\Library\\lib\\gz-${{ component_name }}-${{ major_version }}\\engine-plugins\\gz-rendering-ogre.dll exit 1

  # Optional ogre 1.x engine plugin; pulls in ogre 1.10.
  - package:
      name: ${{ cxx_name }}-ogre
    inherit: ${{ cxx_name }}-build
    build:
      files:
        include:
          - "**/engine-plugins/*gz-rendering9-ogre.*"
          - "**/engine-plugins/*gz-rendering-ogre.*"
          - "lib/*gz-rendering9-ogre.*"
          - "Library/lib/gz-rendering9-ogre.*"
          - "Library/bin/gz-rendering9-ogre.*"
          - "**/cmake/gz-rendering9-ogre/**"
          - "**/gz/rendering/ogre/**"
          - "**/gz/rendering/ogre.hh"
          - "**/pkgconfig/gz-rendering9-ogre.pc"
          - "**/share/gz/gz-rendering9/ogre/**"
    requirements:
      host:
        - ogre 1.10.*
      run:
        - ${{ pin_subpackage(cxx_name, exact=True) }}
        - ${{ pin_compatible('ogre', upper_bound='x.x') }}
      run_exports:
        - ${{ pin_subpackage(cxx_name + '-ogre', upper_bound='x') }}
    tests:
      - script:
          - if: not win
            then:
              - test -f ${PREFIX}/lib/gz-${{ component_name }}-${{ major_version }}/engine-plugins/lib${{ name }}-ogre${SHLIB_EXT}
              - test -f ${PREFIX}/lib/gz-${{ component_name }}-${{ major_version }}/engine-plugins/libgz-rendering-ogre${SHLIB_EXT}
              - test -f ${PREFIX}/lib/cmake/${{ name }}-ogre/${{ name }}-ogre-config.cmake
            else:
              - if not exist %PREFIX%\\Library\\lib\\gz-${{ component_name }}-${{ major_version }}\\engine-plugins\\${{ name }}-ogre.dll exit 1
              - if not exist %PREFIX%\\Library\\lib\\gz-${{ component_name }}-${{ major_version }}\\engine-plugins\\gz-rendering-ogre.dll exit 1
              - if not exist %PREFIX%\\Library\\lib\\cmake\\${{ name }}-ogre\\${{ name }}-ogre-config.cmake exit 1

  - package:
      name: ${{ name }}-ogre
    requirements:
      run:
        - ${{ pin_subpackage(cxx_name + '-ogre', exact=True) }}
      run_exports:
        - ${{ pin_subpackage(cxx_name + '-ogre', upper_bound='x') }}
    tests:
      - script:
          - if: not win
            then:
              - test -f ${PREFIX}/lib/gz-${{ component_name }}-${{ major_version }}/engine-plugins/lib${{ name }}-ogre${SHLIB_EXT}
              - test -f ${PREFIX}/lib/gz-${{ component_name }}-${{ major_version }}/engine-plugins/libgz-rendering-ogre${SHLIB_EXT}
            else:
              - if not exist %PREFIX%\\Library\\lib\\gz-${{ component_name }}-${{ major_version }}\\engine-plugins\\${{ name }}-ogre.dll exit 1
              - if not exist %PREFIX%\\Library\\lib\\gz-${{ component_name }}-${{ major_version }}\\engine-plugins\\gz-rendering-ogre.dll exit 1

  - package:
      name: ${{ name }}
    requirements:
      run:
        - ${{ pin_subpackage(cxx_name, exact=True) }}
      run_exports:
        - ${{ pin_subpackage(cxx_name, upper_bound='x') }}
    tests:
      - script:
          - if: not win
            then:
              - test -f ${PREFIX}/include/gz/${{ component_version }}/gz/${{ component_name }}.hh
              - test -f ${PREFIX}/lib/cmake/${{ name }}/${{ name }}-config.cmake
          - if: linux
            then:
              - test -f ${PREFIX}/lib/lib${{ name }}.so
          - if: osx
            then:
              - test -f ${PREFIX}/lib/lib${{ name }}.dylib
          - if: win
            then:
              - if not exist %PREFIX%\\Library\\include\\gz\\${{ component_version }}\\gz\\${{ component_name }}.hh exit 1
              - if not exist %PREFIX%\\Library\\lib\\${{ name }}.lib exit 1
              - if not exist %PREFIX%\\Library\\bin\\${{ name }}.dll exit 1
              - if not exist %PREFIX%\\Library\\lib\\cmake\\${{ name }}\\${{ name }}-config.cmake exit 1

  # Versionless dummy packages, see https://github.com/conda-forge/gz-sim-feedstock/issues/102
  - package:
      name: libgz-${{ component_name }}
    requirements:
      run:
        - ${{ pin_subpackage(cxx_name, exact=true) }}
      run_exports:
        - ${{ pin_subpackage(cxx_name, upper_bound='x') }}
        - ${{ pin_subpackage('libgz-rendering', upper_bound='x') }}
    tests:
      - script:
          - cmake-package-check gz-${{ component_name }}${{ major_version }}
        requirements:
          run:
            - cmake-package-check
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}

  - package:
      name: gz-${{ component_name }}
    requirements:
      run:
        - ${{ pin_subpackage(name, exact=true) }}
        - ${{ pin_subpackage('libgz-rendering', exact=true) }}
      run_exports:
        - ${{ pin_subpackage(cxx_name, upper_bound='x') }}
        - ${{ pin_subpackage('libgz-rendering', upper_bound='x') }}
    tests:
      - script:
          - cmake-package-check gz-${{ component_name }}${{ major_version }}
        requirements:
          run:
            - cmake-package-check
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}

  - package:
      name: libgz-${{ component_name }}-ogre
    requirements:
      run:
        - ${{ pin_subpackage(cxx_name + '-ogre', exact=true) }}
      run_exports:
        - ${{ pin_subpackage(cxx_name + '-ogre', upper_bound='x') }}
        - ${{ pin_subpackage('libgz-rendering-ogre', upper_bound='x') }}
    tests:
      - script:
          - cmake-package-check gz-${{ component_name }}${{ major_version }}-ogre
        requirements:
          run:
            - cmake-package-check
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}

  - package:
      name: gz-${{ component_name }}-ogre
    requirements:
      run:
        - ${{ pin_subpackage(name + '-ogre', exact=true) }}
        - ${{ pin_subpackage('libgz-rendering-ogre', exact=true) }}
      run_exports:
        - ${{ pin_subpackage(cxx_name + '-ogre', upper_bound='x') }}
        - ${{ pin_subpackage('libgz-rendering-ogre', upper_bound='x') }}
    tests:
      - script:
          - cmake-package-check gz-${{ component_name }}${{ major_version }}-ogre
        requirements:
          run:
            - cmake-package-check
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}

about:
  homepage: https://github.com/gazebosim/${{ repo_name }}
  license: Apache-2.0
  license_file: LICENSE
  summary: C++ library designed to provide an abstraction for different rendering engines. It offers unified APIs for creating 3D graphics applications.

extra:
  feedstock-name: ${{ repo_name }}
  recipe-maintainers:
    - wolfv
    - traversaro
